<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ऑटो वाला 🚕</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:#fff;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  overflow-x:hidden;
  padding-bottom:150px;

  background:
    radial-gradient(circle at 50% 8%,#3c78ad 0,#24527f 30%,transparent 55%),
    radial-gradient(circle at 90% 80%,#9b302b 0,transparent 35%),
    linear-gradient(180deg,#0b2545 0%,#183f6b 50%,#512529 100%);
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  opacity:.45;

  background:
    radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 80% 40%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 40% 75%,#fff 0 1px,transparent 2px);

  background-size:110px 110px,150px 150px,180px 180px;
}


/* =========================
   LOADING SCREEN
========================= */

#loadingScreen{
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle at 50% 38%,#24527f 0%,#0b2545 45%,#071321 100%);

  transition:
    opacity .55s ease,
    visibility .55s ease;
}

#loadingScreen.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loaderAuto{
  font-size:72px;

  filter:
    drop-shadow(0 12px 20px #0008);

  animation:
    loaderBounce 1s ease-in-out infinite;
}

@keyframes loaderBounce{
  0%,100%{
    transform:translateY(0) rotate(-2deg);
  }

  50%{
    transform:translateY(-10px) rotate(2deg);
  }
}

.loaderBrand{
  margin-top:18px;

  font-size:32px;
  font-weight:1000;

  letter-spacing:-1px;

  text-shadow:
    0 5px 20px #0008;
}

.loaderText{
  margin-top:9px;

  font-size:13px;

  opacity:.65;
}

.loaderDots{
  display:flex;
  gap:5px;

  margin-top:18px;
}

.loaderDots span{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#fff;

  animation:
    loaderDot .8s infinite alternate;
}

.loaderDots span:nth-child(2){
  animation-delay:.2s;
}

.loaderDots span:nth-child(3){
  animation-delay:.4s;
}

@keyframes loaderDot{
  from{
    opacity:.25;
    transform:translateY(0);
  }

  to{
    opacity:1;
    transform:translateY(-5px);
  }
}


/* =========================
   HEADER
========================= */

header{
  position:relative;
  z-index:10;

  height:68px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 24px;

  background:#071b3270;

  border-bottom:1px solid #ffffff0d;

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.clock{
  font-size:13px;
  font-weight:700;
}

.live{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;

  font-size:13px;
  opacity:.9;
}

.dot{
  display:inline-block;

  width:8px;
  height:8px;

  margin-right:7px;

  border-radius:50%;

  background:#43e779;

  box-shadow:
    0 0 0 4px #43e77918,
    0 0 16px #43e779;

  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.4;
  }
}


/* =========================
   HERO
========================= */

.heroTitle{
  text-align:center;
  margin-top:45px;
}

.heroTitle h1{
  margin:0;

  font-size:clamp(55px,10vw,100px);

  line-height:.95;

  font-weight:1000;

  letter-spacing:-5px;

  text-shadow:
    0 8px 25px #0009,
    0 0 45px #ffffff12;
}

.heroTitle p{
  margin:13px 0 0;

  font-size:15px;

  opacity:.72;
}

.hero{
  height:380px;

  position:relative;

  display:flex;

  justify-content:center;
  align-items:center;
}


/* =========================
   AUTO
========================= */

.auto{
  position:relative;

  width:520px;
  height:260px;

  transform:scale(.9);

  filter:
    drop-shadow(0 25px 25px #0009)
    drop-shadow(0 0 35px #f29b3515);

  animation:floatAuto 4s ease-in-out infinite;
}

@keyframes floatAuto{
  0%,100%{
    transform:translateY(0) scale(.9);
  }

  50%{
    transform:translateY(-8px) scale(.9);
  }
}

.roof{
  position:absolute;

  left:160px;
  top:10px;

  width:220px;
  height:105px;

  background:linear-gradient(135deg,#e4a13d,#bd7121);

  border:5px solid #f4b957;

  border-bottom:0;

  border-radius:25px;

  box-shadow:inset 0 5px 12px #fff2;
}

.cab{
  position:absolute;

  left:130px;
  top:80px;

  width:300px;
  height:130px;

  background:linear-gradient(145deg,#202a26,#101514);

  border:5px solid #303934;

  border-radius:10px 35px 18px 8px;
}

.win{
  position:absolute;

  top:95px;

  width:82px;
  height:60px;

  background:linear-gradient(135deg,#6da7ba,#294954);

  border:4px solid #101919;
}

.w1{
  left:185px;
}

.w2{
  left:280px;
}

.front{
  position:absolute;

  right:5px;
  top:80px;

  width:145px;
  height:130px;

  background:linear-gradient(145deg,#c85829,#96351e);

  border:5px solid #7d2c1c;

  border-radius:20px 35px 15px 5px;
}

.base{
  position:absolute;

  left:50px;
  top:145px;

  width:440px;
  height:85px;

  background:linear-gradient(180deg,#151b19,#080b0a);

  border-radius:6px 20px 20px 30px;
}

.wheel{
  position:absolute;

  bottom:0;

  width:70px;
  height:70px;

  border-radius:50%;

  background:#080909;

  border:12px solid #292929;

  box-shadow:
    inset 0 0 0 4px #111,
    0 8px 15px #0008;
}

.a{
  left:85px;
}

.b{
  right:55px;
}

.tag{
  position:absolute;

  bottom:8px;

  left:0;
  right:0;

  text-align:center;

  font-size:18px;

  font-weight:800;

  text-shadow:0 3px 10px #000;
}


/* =========================
   SEARCH
========================= */

.searchBox{
  width:min(760px,92%);

  margin:0 auto 28px;

  position:relative;
}

.searchBox input{
  width:100%;

  padding:17px 20px 17px 52px;

  border:1px solid #ffffff20;

  border-radius:20px;

  outline:none;

  color:#fff;

  background:#ffffff0e;

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  font-size:15px;

  box-shadow:
    0 15px 35px #00018,
    inset 0 1px #fff1;

  transition:.25s;
}

.searchBox input:focus{
  border-color:#ffffff45;

  background:#ffffff14;

  box-shadow:
    0 15px 40px #00025,
    0 0 0 4px #ffffff08;
}

.searchBox input::placeholder{
  color:#ffffff88;
}

.searchIcon{
  position:absolute;

  left:18px;
  top:50%;

  transform:translateY(-50%);

  font-size:19px;

  opacity:.8;

  pointer-events:none;
}


/* =========================
   SONG SECTION
========================= */

.section{
  width:min(760px,92%);
  margin:0 auto;
}

.sectionTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin:18px 0 12px;
  padding:0 3px;
}

.sectionTitle h2{
  margin:0;
  font-size:21px;
}

.sectionTitle span{
  padding:6px 10px;

  border:1px solid #ffffff14;
  border-radius:999px;

  background:#ffffff08;

  font-size:11px;
  opacity:.7;
}


/* =========================
   SONG CARD
========================= */

.song{
  position:relative;

  display:flex;
  align-items:center;

  gap:14px;

  padding:12px;

  margin:10px 0;

  border:1px solid #ffffff12;

  border-radius:20px;

  background:
    linear-gradient(135deg,#ffffff0d,#ffffff03),
    #171a1c80;

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  cursor:pointer;

  transition:
    transform .2s ease,
    border-color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

.song:hover{
  transform:translateY(-3px);

  border-color:#ffffff2c;

  background:
    linear-gradient(135deg,#ffffff14,#ffffff06),
    #171a1c95;

  box-shadow:
    0 15px 35px #00035;
}

.song:active{
  transform:scale(.985);
}


/* CURRENT SONG */

.song.playing{
  border-color:#ffffff38;

  background:
    linear-gradient(135deg,#ffffff18,#ffffff07),
    #171a1caa;

  box-shadow:
    0 0 0 1px #ffffff0c,
    0 12px 35px #00035,
    0 0 25px #ffffff08;
}

.song.playing .title{
  color:#fff;
}

.cover{
  width:55px;
  height:55px;

  flex:none;

  border-radius:16px;

  background:
    radial-gradient(
      circle,
      #f1c55d 0 18%,
      #3b2810 19% 40%,
      #d18c29 41% 47%,
      #17100a 48% 70%,
      #8c5c1b 71%
    );

  box-shadow:
    0 7px 17px #0007,
    inset 0 1px #fff3;
}

.playing .cover{
  animation:coverPulse 1.8s ease-in-out infinite;
}

@keyframes coverPulse{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.045);
  }
}

.meta{
  flex:1;
  min-width:0;
}

.title{
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  font-size:15px;
}

.artist{
  margin-top:5px;

  font-size:12px;

  opacity:.58;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* =========================
   EQUALIZER
========================= */

.equalizer{
  display:none;

  align-items:flex-end;

  gap:3px;

  width:22px;
  height:20px;

  margin-right:2px;
}

.playing .equalizer{
  display:flex;
}

.eqBar{
  width:4px;

  height:7px;

  border-radius:3px;

  background:#fff;

  animation:eq .7s ease-in-out infinite alternate;
}

.eqBar:nth-child(2){
  animation-delay:.2s;
}

.eqBar:nth-child(3){
  animation-delay:.4s;
}

@keyframes eq{
  from{
    height:5px;
    opacity:.45;
  }

  to{
    height:18px;
    opacity:1;
  }
}


/* =========================
   PLAY BUTTON
========================= */

.playBtn{
  width:42px;
  height:42px;

  flex:none;

  border:0;

  border-radius:50%;

  cursor:pointer;

  background:#fff;

  color:#111;

  box-shadow:
    0 6px 18px #0005;

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.playBtn:hover{
  transform:scale(1.09);

  box-shadow:
    0 8px 22px #0007;
}

.playing .playBtn{
  background:#ffffffeb;

  transform:scale(1.04);
}


/* =========================
   PLAYER
========================= */

.player{
  position:fixed;

  left:50%;
  bottom:15px;

  transform:translateX(-50%);

  z-index:20;

  width:min(720px,94%);

  display:flex;
  align-items:center;

  gap:12px;

  padding:11px 14px;

  border:1px solid #ffffff25;

  border-radius:27px;

  background:
    linear-gradient(135deg,#ffffff0d,#ffffff03),
    #20191ddd;

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  box-shadow:
    0 20px 55px #0009,
    0 0 35px #0003,
    inset 0 1px #fff2;
}

.player .cover{
  width:54px;
  height:54px;
}

.playerInfo{
  flex:1;
  min-width:0;
}

.playerTitle{
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  font-size:14px;
}

.playerArtist{
  font-size:11px;

  opacity:.58;

  margin-top:3px;
}

audio{
  width:100%;
  height:31px;
  margin-top:4px;
}

.controls{
  display:flex;
  align-items:center;
  gap:5px;
}

.controls button{
  width:36px;
  height:36px;

  border:0;

  background:transparent;

  color:#fff;

  font-size:22px;

  cursor:pointer;

  border-radius:50%;

  transition:.18s;
}

.controls button:hover{
  background:#ffffff10;
}

.mainBtn{
  width:43px!important;
  height:43px!important;

  border-radius:50%!important;

  background:#fff!important;

  color:#111!important;

  font-size:17px!important;

  box-shadow:0 6px 18px #0005;
}

.player.active{
  box-shadow:
    0 20px 55px #0009,
    0 0 35px #ffffff09,
    inset 0 1px #fff2;
}


/* =========================
   OTHER BUTTONS
========================= */

.horn{
  position:fixed;

  left:18px;
  bottom:125px;

  z-index:15;

  padding:10px 15px;

  border:1px solid #ffffff20;

  border-radius:15px;

  color:#fff;

  background:#173d7380;

  backdrop-filter:blur(15px);

  cursor:pointer;
}

.onlineBox{
  position:fixed;

  right:18px;
  bottom:125px;

  z-index:15;

  padding:10px 14px;

  border:1px solid #ffffff20;

  border-radius:15px;

  background:#173d7380;

  backdrop-filter:blur(15px);

  font-size:12px;
}

.empty{
  text-align:center;

  padding:35px 20px;

  margin-top:10px;

  border:1px dashed #ffffff18;

  border-radius:20px;

  background:#ffffff05;

  opacity:.6;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  body{
    padding-bottom:125px;
  }

  header{
    height:58px;
    padding:0 12px;
  }

  .clock{
    font-size:10px;
  }

  .live{
    font-size:10px;
  }

  .heroTitle{
    margin-top:43px;
  }

  .heroTitle h1{
    font-size:58px;
    letter-spacing:-4px;
  }

  .heroTitle p{
    font-size:12px;
  }

  .hero{
    height:220px;
  }

  .auto{
    transform:scale(.48);
  }

  @keyframes floatAuto{
    0%,100%{
      transform:translateY(0) scale(.48);
    }

    50%{
      transform:translateY(-6px) scale(.48);
    }
  }

  .tag{
    bottom:0;
    font-size:12px;
  }

  .searchBox{
    width:calc(100% - 24px);
    margin-bottom:20px;
  }

  .searchBox input{
    padding:15px 16px 15px 47px;
    border-radius:17px;
    font-size:14px;
  }

  .section{
    width:calc(100% - 24px);
  }

  .sectionTitle{
    margin:15px 0 9px;
  }

  .sectionTitle h2{
    font-size:19px;
  }

  .song{
    gap:10px;
    padding:9px;
    border-radius:17px;
  }

  .cover{
    width:48px;
    height:48px;
    border-radius:14px;
  }

  .title{
    font-size:14px;
  }

  .artist{
    font-size:11px;
  }

  .playBtn{
    width:38px;
    height:38px;
  }

  .equalizer{
    width:18px;
  }

  .player{
    width:calc(100% - 16px);

    left:8px;
    bottom:8px;

    transform:none;

    gap:9px;

    padding:8px 10px;

    border-radius:18px;
  }

  .player .cover{
    width:42px;
    height:42px;
    border-radius:12px;
  }

  .playerTitle{
    font-size:12px;
  }

  .playerArtist{
    font-size:10px;
  }

  audio{
    height:27px;
    margin-top:2px;
  }

  .controls{
    gap:0;
  }

  .controls button{
    width:31px;
    height:31px;
    font-size:18px;
  }

  .mainBtn{
    width:37px!important;
    height:37px!important;
    font-size:15px!important;
  }

  .horn{
    left:8px;
    bottom:98px;
    padding:8px 11px;
    font-size:10px;
    border-radius:12px;
  }

  .onlineBox{
    right:8px;
    bottom:98px;
    padding:8px 10px;
    font-size:10px;
    border-radius:12px;
  }

  .loaderAuto{
    font-size:58px;
  }

  .loaderBrand{
    font-size:27px;
  }

  .loaderText{
    font-size:12px;
  }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:380px){

  .heroTitle h1{
    font-size:50px;
  }

  .hero{
    height:205px;
  }

  .auto{
    transform:scale(.44);
  }

  @keyframes floatAuto{
    0%,100%{
      transform:translateY(0) scale(.44);
    }

    50%{
      transform:translateY(-5px) scale(.44);
    }
  }

  .playerArtist{
    display:none;
  }

  .controls button{
    width:28px;
  }

  .mainBtn{
    width:35px!important;
    height:35px!important;
  }

}
</style>
</head>


<body>


<!-- =========================
     LOADING SCREEN
========================= -->

<div id="loadingScreen">

  <div class="loaderAuto">
    🚕
  </div>

  <div class="loaderBrand">
    ऑटो वाला
  </div>

  <div class="loaderText">
    गाने लोड हो रहे हैं...
  </div>

  <div class="loaderDots">
    <span></span>
    <span></span>
    <span></span>
  </div>

</div>


<!-- HEADER -->

<header>

  <span
    class="clock"
    id="clock"
  >
    --:--:--
  </span>

  <span class="live">
    <i class="dot"></i>
    <b id="count">1</b>
    on the highway
  </span>

  <span>•••</span>

</header>


<!-- HERO -->

<section class="heroTitle">

  <h1>ऑटो वाला</h1>

  <p>
    🎵 सफर अपना, गाना अपना
  </p>

</section>


<section class="hero">

  <div class="auto">

    <div class="roof"></div>

    <div class="cab"></div>

    <div class="win w1"></div>

    <div class="win w2"></div>

    <div class="front"></div>

    <div class="base"></div>

    <div class="wheel a"></div>

    <div class="wheel b"></div>

  </div>

  <div class="tag">
    जो डर गया, समझो मर गया 😎
  </div>

</section>


<!-- SEARCH -->

<div class="searchBox">

  <span class="searchIcon">
    🔍
  </span>

  <input
    id="search"
    placeholder="गाना या कलाकार खोजें..."
    autocomplete="off"
  >

</div>


<!-- SONGS -->

<section class="section">

  <div class="sectionTitle">

    <h2>🎵 गाने</h2>

    <span id="songCount">
      0 songs
    </span>

  </div>

  <div id="list"></div>

</section>


<!-- HORN -->

<button
  class="horn"
  id="horn"
>
  🔊 हॉर्न ओके प्लीज
</button>


<!-- ONLINE -->

<div class="onlineBox">
  🟢 <span id="onlineText">Live</span>
</div>


<!-- PLAYER -->

<div
  class="player"
  id="player"
>

  <div
    class="cover"
    id="pcover"
  ></div>

  <div class="playerInfo">

    <div
      class="playerTitle"
      id="ptitle"
    >
      अपना गाना चुनें
    </div>

    <div
      class="playerArtist"
      id="partist"
    >
      Auto Wala
    </div>

    <audio
      id="audio"
      controls
    ></audio>

  </div>

  <div class="controls">

    <button onclick="prev()">
      ‹
    </button>

    <button
      class="mainBtn"
      id="mainBtn"
      onclick="toggle()"
    >
      ▶
    </button>

    <button onclick="next()">
      ›
    </button>

  </div>

</div>


<script>

let songs=[];
let filteredSongs=[];
let idx=-1;

const audio=
document.getElementById("audio");


/* =========================
   VISITOR
========================= */

const visitorId=
localStorage.getItem(
  "autoWalaVisitor"
) ||
(
  "visitor-" +
  Date.now() +
  "-" +
  Math.random()
    .toString(36)
    .slice(2)
);

localStorage.setItem(
  "autoWalaVisitor",
  visitorId
);


/* =========================
   CLOCK
========================= */

function updateClock(){

  const now=
  new Date();

  const time=
  new Intl.DateTimeFormat(
    "en-IN",
    {
      timeZone:"Asia/Kolkata",
      hour:"numeric",
      minute:"2-digit",
      second:"2-digit",
      hour12:true
    }
  ).format(now);

  document.getElementById(
    "clock"
  ).textContent=time;

}

updateClock();

setInterval(
  updateClock,
  1000
);


/* =========================
   ONLINE
========================= */

async function heartbeat(){

  try{

    const response=
    await fetch(
      "/api/heartbeat",
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({
          visitorId
        })
      }
    );

    if(!response.ok)
      return;

    const data=
    await response.json();

    document.getElementById(
      "count"
    ).textContent=data.online;

    document.getElementById(
      "onlineText"
    ).textContent=
      data.online+
      " online";

  }catch(error){

    document.getElementById(
      "onlineText"
    ).textContent="Live";

  }

}

heartbeat();

setInterval(
  heartbeat,
  30000
);


/* =========================
   VISIT
========================= */

fetch(
  "/api/visit",
  {
    method:"POST",

    headers:{
      "Content-Type":
      "application/json"
    },

    body:JSON.stringify({
      visitorId
    })
  }
).catch(()=>{});


/* =========================
   CLEAN TITLE
========================= */

function cleanSongTitle(title){

  return String(title || "")
    .replace(/\.[^/.]+$/, "")
    .replace(/[_-]+/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* =========================
   ESCAPE
========================= */

function esc(text){

  return String(
    text || ""
  ).replace(
    /[&<>"']/g,

    m =>
      ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m])
  );

}


/* =========================
   HIDE LOADING
========================= */

function hideLoading(){

  const loader=
  document.getElementById(
    "loadingScreen"
  );

  if(!loader)
    return;

  loader.classList.add(
    "hide"
  );

}


/* =========================
   LOAD SONGS
========================= */

async function load(){

  try{

    const response=
    await fetch(
      "/api/songs"
    );

    if(!response.ok){
      throw new Error(
        "Songs API failed"
      );
    }

    songs=
    await response.json();

    filteredSongs=
    [...songs];

    render();

    /*
      थोड़ा सा delay ताकि
      loading animation smooth
      लगे और अचानक गायब न हो।
    */

    setTimeout(
      hideLoading,
      350
    );

  }catch(error){

    document.getElementById(
      "list"
    ).innerHTML=
      `
      <div class="empty">
        Songs load नहीं हो पाए 😕
      </div>
      `;

    hideLoading();

  }

}


/* =========================
   RENDER
========================= */

function render(){

  const box=
  document.getElementById(
    "list"
  );

  document.getElementById(
    "songCount"
  ).textContent=
    filteredSongs.length+
    " songs";


  if(!filteredSongs.length){

    box.innerHTML=
      `
      <div class="empty">
        कोई गाना नहीं मिला 😕
      </div>
      `;

    return;

  }


  box.innerHTML=
  filteredSongs
  .map(
    (song,i)=>`

      <div
        class="song ${
          idx===i &&
          audio.src
          ? "playing"
          : ""
        }"
        onclick="play(${i})"
      >

        <div
          class="cover"
          ${
            song.cover
            ?
            `style="background:url('${song.cover}') center/cover"`
            :
            ""
          }
        ></div>

        <div class="meta">

          <div class="title">
            ${esc(
              cleanSongTitle(
                song.title
              )
            )}
          </div>

          <div class="artist">
            ${esc(
              song.artist
            )}
          </div>

        </div>


        <div class="equalizer">

          <span class="eqBar"></span>
          <span class="eqBar"></span>
          <span class="eqBar"></span>

        </div>


        <button
          class="playBtn"
          onclick="event.stopPropagation();play(${i})"
        >
          ${
            idx===i &&
            !audio.paused
            ? "❚❚"
            : "▶"
          }
        </button>

      </div>

    `
  )
  .join("");

}


/* =========================
   SEARCH
========================= */

document
.getElementById("search")
.addEventListener(
  "input",
  function(){

    const query=
    this.value
      .trim()
      .toLowerCase();

    filteredSongs=
    songs.filter(
      song=>
        String(song.title)
          .toLowerCase()
          .includes(query)
        ||
        String(song.artist)
          .toLowerCase()
          .includes(query)
    );

    idx=-1;

    render();

  }
);


/* =========================
   PLAY
========================= */

async function play(i){

  if(!filteredSongs[i])
    return;

  const song=
  filteredSongs[i];

  idx=i;

  audio.src=
    song.audio;

  document.getElementById(
    "ptitle"
  ).textContent=
    cleanSongTitle(
      song.title
    );

  document.getElementById(
    "partist"
  ).textContent=
    song.artist ||
    "Various Artists";


  document.getElementById(
    "pcover"
  ).style.background=
    song.cover
    ?
    `url('${song.cover}') center/cover`
    :
    "";


  document.getElementById(
    "player"
  ).classList.add(
    "active"
  );


  try{

    await audio.play();

  }catch(error){}


  fetch(
    "/api/play",
    {
      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({
        songId:song.id
      })
    }
  ).catch(()=>{});


  render();

}


/* =========================
   TOGGLE
========================= */

function toggle(){

  if(
    !audio.src &&
    filteredSongs.length
  ){

    play(0);

    return;

  }


  if(audio.paused){

    audio.play();

  }else{

    audio.pause();

  }

}


/* =========================
   NEXT
========================= */

function next(){

  if(!filteredSongs.length)
    return;

  idx=
    (idx+1)
    %
    filteredSongs.length;

  play(idx);

}


/* =========================
   PREVIOUS
========================= */

function prev(){

  if(!filteredSongs.length)
    return;

  idx=
    (idx-1+
      filteredSongs.length)
    %
    filteredSongs.length;

  play(idx);

}


/* =========================
   AUDIO EVENTS
========================= */

audio.onended=
  next;


audio.onplay=
  ()=>{

    document.getElementById(
      "mainBtn"
    ).textContent="❚❚";

    render();

  };


audio.onpause=
  ()=>{

    document.getElementById(
      "mainBtn"
    ).textContent="▶";

    render();

  };


/* =========================
   HORN
========================= */

document
.getElementById("horn")
.addEventListener(
  "click",
  ()=>{
    alert(
      "📢 हॉर्न ओके प्लीज 😎"
    );
  }
);


/* =========================
   START
========================= */

load();

</script>

</body>
</html>
