<body>

<header>

  <span class="clock" id="clock">
    --:--:--
  </span>

  <span class="live">
    <i class="dot"></i>
    <b id="count">1</b>
    on the highway
  </span>

  <span>•••</span>

</header>

<section class="heroTitle">

  <h1>ऑटो वाला</h1>

  <p>
    🎵 सफर अपना, गाना अपना
  </p>

</section>

<section class="hero">

  <div class="auto">

    <div class="roof"></div>

    <div class="cab"></div>

    <div class="win w1"></div>

    <div class="win w2"></div>

    <div class="front"></div>

    <div class="base"></div>

    <div class="wheel a"></div>

    <div class="wheel b"></div>

  </div>

  <div class="tag">
    जो डर गया, समझो मर गया 😎
  </div>

</section>

<div class="searchBox">

  <span class="searchIcon">🔍</span>

  <input
    id="search"
    placeholder="गाना या कलाकार खोजें..."
    autocomplete="off"
  >

</div>

<section class="section">

  <div class="sectionTitle">

    <h2>🎵 गाने</h2>

    <span id="songCount">
      0 songs
    </span>

  </div>

  <div id="list"></div>

</section>

<button class="horn" id="horn">
  🔊 हॉर्न ओके प्लीज
</button>

<div class="onlineBox">
  🟢 <span id="onlineText">Live</span>
</div>

<div class="player">

  <div
    class="cover"
    id="pcover"
  ></div>

  <div class="playerInfo">

    <div
      class="playerTitle"
      id="ptitle"
    >
      अपना गाना चुनें
    </div>

    <div
      class="playerArtist"
      id="partist"
    >
      Auto Wala
    </div>

    <audio
      id="audio"
      controls
    ></audio>

  </div>

  <div class="controls">

    <button onclick="prev()">
      ‹
    </button>

    <button
      class="mainBtn"
      id="mainBtn"
      onclick="toggle()"
    >
      ▶
    </button>

    <button onclick="next()">
      ›
    </button>

  </div>

</div>

<script>

let songs=[];

let filteredSongs=[];

let idx=-1;

const audio=
document.getElementById("audio");


/* VISITOR ID */

const visitorId=
localStorage.getItem(
  "autoWalaVisitor"
) ||
(
  "visitor-" +
  Date.now() +
  "-" +
  Math.random()
    .toString(36)
    .slice(2)
);

localStorage.setItem(
  "autoWalaVisitor",
  visitorId
);


/* LIVE CLOCK */

function updateClock(){

  const now=
  new Date();

  const time=
  new Intl.DateTimeFormat(
    "en-IN",
    {
      timeZone:"Asia/Kolkata",
      hour:"numeric",
      minute:"2-digit",
      second:"2-digit",
      hour12:true
    }
  ).format(now);

  document.getElementById(
    "clock"
  ).textContent=time;

}

updateClock();

setInterval(
  updateClock,
  1000
);


/* ONLINE */

async function heartbeat(){

  try{

    const response=
    await fetch(
      "/api/heartbeat",
      {
        method:"POST",
        headers:{
          "Content-Type":
          "application/json"
        },
        body:JSON.stringify({
          visitorId
        })
      }
    );

    if(!response.ok)
      return;

    const data=
    await response.json();

    document.getElementById(
      "count"
    ).textContent=data.online;

    document.getElementById(
      "onlineText"
    ).textContent=
      data.online+
      " online";

  }catch(error){

    document.getElementById(
      "onlineText"
    ).textContent=
      "Live";

  }

}

heartbeat();

setInterval(
  heartbeat,
  30000
);


/* VISIT */

fetch(
  "/api/visit",
  {
    method:"POST",
    headers:{
      "Content-Type":
      "application/json"
    },
    body:JSON.stringify({
      visitorId
    })
  }
).catch(()=>{});


/* LOAD SONGS */

async function load(){

  try{

    const response=
    await fetch(
      "/api/songs"
    );

    songs=
    await response.json();

    filteredSongs=
    [...songs];

    render();

  }catch(error){

    document.getElementById(
      "list"
    ).innerHTML=
      `<div class="empty">
        Songs load नहीं हो पाए 😕
      </div>`;

  }

}


/* RENDER */

function render(){

  const box=
  document.getElementById(
    "list"
  );

  document.getElementById(
    "songCount"
  ).textContent=
    filteredSongs.length+
    " songs";


  if(!filteredSongs.length){

    box.innerHTML=
      `<div class="empty">
        कोई गाना नहीं मिला 😕
      </div>`;

    return;

  }


  box.innerHTML=
  filteredSongs
  .map(
    (song,i)=>`

      <div
        class="song"
        onclick="play(${i})"
      >

        <div
          class="cover"
          ${
            song.cover
            ?
            `style="background:url('${song.cover}') center/cover"`
            :
            ""
          }
        ></div>

        <div class="meta">

          <div class="title">
            ${esc(song.title)}
          </div>

          <div class="artist">
            ${esc(song.artist)}
          </div>

        </div>

        <button
          class="favBtn"
          onclick="event.stopPropagation();favorite('${song.id}')"
        >
          ♡
        </button>

        <button
          class="playBtn"
          onclick="event.stopPropagation();play(${i})"
        >
          ▶
        </button>

      </div>

    `
  )
  .join("");

}


/* SEARCH */

document
.getElementById("search")
.addEventListener(
  "input",
  function(){

    const query=
    this.value
      .trim()
      .toLowerCase();

    filteredSongs=
    songs.filter(
      song=>
        String(song.title)
          .toLowerCase()
          .includes(query)
        ||
        String(song.artist)
          .toLowerCase()
          .includes(query)
    );

    render();

  }
);


/* PLAY */

async function play(i){

  if(
    !filteredSongs[i]
  )
    return;

  const song=
  filteredSongs[i];

  idx=i;

  audio.src=
    song.audio;

  document.getElementById(
    "ptitle"
  ).textContent=
    song.title;

  document.getElementById(
    "partist"
  ).textContent=
    song.artist;

  document.getElementById(
    "pcover"
  ).style.background=
    song.cover
    ?
    `url('${song.cover}') center/cover`
    :
    "";

  try{

    await audio.play();

  }catch(error){}


  /*
    Analytics endpoint exists
    in the upgraded backend.
    If old backend is being used,
    this simply fails silently.
  */

  fetch(
    "/api/play",
    {
      method:"POST",
      headers:{
        "Content-Type":
        "application/json"
      },
      body:JSON.stringify({
        songId:song.id
      })
    }
  ).catch(()=>{});

}


/* TOGGLE */

function toggle(){

  if(
    !audio.src &&
    filteredSongs.length
  ){

    play(0);

    return;

  }


  if(audio.paused){

    audio.play();

  }else{

    audio.pause();

  }

}


/* NEXT */

function next(){

  if(
    !filteredSongs.length
  )
    return;

  idx=
    (idx+1)
    %
    filteredSongs.length;

  play(idx);

}


/* PREVIOUS */

function prev(){

  if(
    !filteredSongs.length
  )
    return;

  idx=
    (idx-1+
      filteredSongs.length)
    %
    filteredSongs.length;

  play(idx);

}


/* AUDIO EVENTS */

audio.onended=
  next;


audio.onplay=
  ()=>{
    document.getElementById(
      "mainBtn"
    ).textContent="❚❚";
  };


audio.onpause=
  ()=>{
    document.getElementById(
      "mainBtn"
    ).textContent="▶";
  };


/* FAVORITE */

function favorite(id){

  let favorites=
    JSON.parse(
      localStorage.getItem(
        "autoWalaFavorites"
      ) ||
      "[]"
    );

  if(
    favorites.includes(id)
  ){

    favorites=
      favorites.filter(
        x=>x!==id
      );

  }else{

    favorites.push(id);

  }

  localStorage.setItem(
    "autoWalaFavorites",
    JSON.stringify(
      favorites
    )
  );

}


/* HORN */

document
.getElementById("horn")
.addEventListener(
  "click",
  ()=>{
    alert(
      "📢 हॉर्न ओके प्लीज 😎"
    );
  }
);


/* ESCAPE */

function esc(text){

  return String(
    text || ""
  ).replace(
    /[&<>"']/g,
    m=>
      ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m])
  );

}
