<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ऑटो वाला</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#fff;background:linear-gradient(180deg,#173d73,#2a5d91 48%,#b93627 78%,#641c20);padding-bottom:150px}
header{display:flex;justify-content:space-between;padding:24px 28px;font-weight:700}.live{position:absolute;left:50%;transform:translateX(-50%)}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#43e779;box-shadow:0 0 10px #43e779;margin-right:7px}
h1{text-align:center;font-size:clamp(52px,8vw,88px);margin:65px 0 10px;font-weight:900}.hero{text-align:center;height:390px;position:relative}.auto{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:520px;max-width:85vw;height:260px;filter:drop-shadow(0 20px 20px #0008)}.roof{position:absolute;left:160px;top:10px;width:220px;height:105px;background:#d68c2c;border:5px solid #efad45;border-bottom:0;border-radius:25px}.cab{position:absolute;left:130px;top:80px;width:300px;height:130px;background:#17201d;border:5px solid #28302c;border-radius:10px 35px 18px 8px}.win{position:absolute;top:95px;width:82px;height:60px;background:#416a78;border:4px solid #101919}.w1{left:185px}.w2{left:280px}.front{position:absolute;right:5px;top:80px;width:145px;height:130px;background:#b84a23;border:5px solid #7d2c1c;border-radius:20px 35px 15px 5px}.base{position:absolute;left:50px;top:145px;width:440px;height:85px;background:#111716;border-radius:6px 20px 20px 30px}.wheel{position:absolute;bottom:0;width:70px;height:70px;border-radius:50%;background:#080909;border:12px solid #292929}.a{left:85px}.b{right:55px}.tag{font-weight:800;text-shadow:0 2px 5px #000;font-size:20px}.sound{position:fixed;left:25px;bottom:125px;border:1px solid #fff9;border-radius:15px;padding:10px 15px;background:#173d7355;cursor:pointer}
.list{width:min(760px,92%);margin:10px auto}.song{display:flex;align-items:center;gap:14px;background:#321d1d99;padding:12px;border-radius:15px;margin:8px 0;cursor:pointer}.cover{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,#e1b24b,#30200d 45%,#d18c29 46%,#17100a 65%);flex:none}.meta{flex:1;min-width:0}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:13px;opacity:.8}.play{border:0;border-radius:50%;width:40px;height:40px;cursor:pointer}.player{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);width:min(620px,92%);background:#6e2b27dd;backdrop-filter:blur(12px);border:1px solid #fff3;border-radius:45px;padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:5}.player .cover{width:55px;height:55px}.info{flex:1;min-width:0}.controls{display:flex;gap:12px;align-items:center}.controls button{border:0;background:transparent;color:#fff;font-size:20px;cursor:pointer}.main{background:#fff;color:#333;border-radius:50%;width:42px;height:42px}.progress{width:100%;margin-top:6px}
@media(max-width:600px){.live{font-size:11px}h1{margin-top:75px}.hero{height:330px}.auto{transform:translate(-50%,-50%) scale(.72)}.sound{bottom:105px}.player{bottom:10px}.controls span{display:none}}
</style></head><body>
<header><span>8:15 am</span><span class="live"><i class="dot"></i><b id="count">587</b> on the highway</span><span>•••</span></header>
<h1>ऑटो वाला</h1><section class="hero"><div class="auto"><div class="roof"></div><div class="cab"></div><div class="win w1"></div><div class="win w2"></div><div class="front"></div><div class="base"></div><div class="wheel a"></div><div class="wheel b"></div></div><div class="tag">जो डर गया, समझो मर गया</div></section>
<div class="sound">🔊 हॉर्न ओके प्लीज</div><section class="list" id="list"></section>
<div class="player"><div class="cover" id="pcover"></div><div class="info"><div class="title" id="ptitle">अपना गाना चुनें</div><div class="artist" id="partist">Auto Wala</div><audio id="audio" controls class="progress"></audio></div><div class="controls"><button onclick="prev()">‹</button><button class="main" onclick="toggle()">▶</button><button onclick="next()">›</button></div></div>
<script>
let songs=[],idx=-1;const audio=document.getElementById('audio');
async function load(){songs=await fetch('/api/songs').then(r=>r.json());render()}
function render(){list.innerHTML=songs.map((s,i)=>`<div class="song" onclick="play(${i})"><div class="cover" ${s.cover?`style="background:url('${s.cover}') center/cover"`:''}></div><div class="meta"><div class="title">${esc(s.title)}</div><div class="artist">${esc(s.artist)}</div></div><button class="play">▶</button></div>`).join('')}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function play(i){idx=i;let s=songs[i];audio.src=s.audio;ptitle.textContent=s.title;partist.textContent=s.artist;pcover.style.background=s.cover?`url('${s.cover}') center/cover`:"";audio.play()}
function toggle(){if(!audio.src&&songs[0])return play(0);audio.paused?audio.play():audio.pause()}
function next(){if(songs.length)play((idx+1)%songs.length)}function prev(){if(songs.length)play((idx-1+songs.length)%songs.length)}audio.onended=next;
setInterval(()=>count.textContent=587+Math.floor(Math.random()*9),3000);load();
</script></body></html>
