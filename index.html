<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ऑटो वाला 🚕</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:#fff;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  overflow-x:hidden;
  padding-bottom:150px;

  background:
    radial-gradient(circle at 50% 8%,#3c78ad 0,#24527f 30%,transparent 55%),
    radial-gradient(circle at 90% 80%,#9b302b 0,transparent 35%),
    linear-gradient(180deg,#0b2545 0%,#183f6b 50%,#512529 100%);
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  opacity:.45;

  background:
    radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 80% 40%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 40% 75%,#fff 0 1px,transparent 2px);

  background-size:110px 110px,150px 150px,180px 180px;
}


/* HEADER */

header{
  position:relative;
  z-index:10;

  height:68px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 24px;

  background:#071b3270;

  border-bottom:1px solid #ffffff0d;

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.clock{
  font-size:13px;
  font-weight:700;
}

.live{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;

  font-size:13px;
  opacity:.9;
}

.dot{
  display:inline-block;

  width:8px;
  height:8px;

  margin-right:7px;

  border-radius:50%;

  background:#43e779;

  box-shadow:
    0 0 0 4px #43e77918,
    0 0 16px #43e779;

  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.4;
  }
}


/* HERO */

.heroTitle{
  position:relative;
  z-index:2;
  text-align:center;
  margin-top:45px;
  padding:0 18px;
}

.heroTitle:before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:min(520px,85vw);
  height:150px;
  transform:translate(-50%,-45%);
  border-radius:50%;
  background:radial-gradient(ellipse,#ffffff18 0,transparent 68%);
  filter:blur(12px);
  pointer-events:none;
  z-index:-1;
}

.heroTitle h1{
  margin:0;

  font-size:clamp(55px,10vw,100px);

  line-height:.95;

  font-weight:1000;

  letter-spacing:-5px;

  background:linear-gradient(180deg,#fff 0%,#ffffffd9 48%,#ffffff9c 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  text-shadow:
    0 8px 25px #0009,
    0 0 45px #ffffff12;
}

.heroTitle p{
  display:inline-block;
  margin:15px 0 0;
  padding:7px 13px;

  font-size:13px;
  line-height:1;

  opacity:.78;
  color:#ffffffd9;

  border:1px solid #ffffff18;
  border-radius:999px;
  background:#ffffff08;
  box-shadow:
    0 8px 22px #00018,
    inset 0 1px #fff1;
}

.hero{
  height:380px;

  position:relative;

  display:flex;

  justify-content:center;
  align-items:center;
}

.hero:after{
  content:"";
  position:absolute;
  left:50%;
  bottom:24px;
  width:min(500px,78vw);
  height:42px;
  transform:translateX(-50%);
  border-radius:50%;
  background:#0008;
  filter:blur(20px);
  opacity:.6;
  pointer-events:none;
}


/* AUTO */

.auto{
  position:relative;

  width:520px;
  height:260px;

  transform:scale(.9);

  filter:
    drop-shadow(0 25px 25px #0009)
    drop-shadow(0 0 35px #f29b3515);

  animation:floatAuto 4s ease-in-out infinite;
}

@keyframes floatAuto{
  0%,100%{
    transform:translateY(0) scale(.9);
  }

  50%{
    transform:translateY(-8px) scale(.9);
  }
}

@media (max-width:600px){
  .heroTitle{
    margin-top:32px;
  }

  .heroTitle h1{
    letter-spacing:-3px;
  }

  .heroTitle p{
    font-size:12px;
  }

  .hero{
    height:330px;
  }
}

.roof{
  position:absolute;

  left:160px;
  top:10px;

  width:220px;
  height:105px;

  background:linear-gradient(135deg,#e4a13d,#bd7121);

  border:5px solid #f4b957;

  border-bottom:0;

  border-radius:25px;

  box-shadow:inset 0 5px 12px #fff2;
}

.cab{
  position:absolute;

  left:130px;
  top:80px;

  width:300px;
  height:130px;

  background:linear-gradient(145deg,#202a26,#101514);

  border:5px solid #303934;

  border-radius:10px 35px 18px 8px;
}

.win{
  position:absolute;

  top:95px;

  width:82px;
  height:60px;

  background:linear-gradient(135deg,#6da7ba,#294954);

  border:4px solid #101919;
}

.w1{
  left:185px;
}

.w2{
  left:280px;
}

.front{
  position:absolute;

  right:5px;
  top:80px;

  width:145px;
  height:130px;

  background:linear-gradient(145deg,#c85829,#96351e);

  border:5px solid #7d2c1c;

  border-radius:20px 35px 15px 5px;
}

.base{
  position:absolute;

  left:50px;
  top:145px;

  width:440px;
  height:85px;

  background:linear-gradient(180deg,#151b19,#080b0a);

  border-radius:6px 20px 20px 30px;
}

.wheel{
  position:absolute;

  bottom:0;

  width:70px;
  height:70px;

  border-radius:50%;

  background:#080909;

  border:12px solid #292929;

  box-shadow:
    inset 0 0 0 4px #111,
    0 8px 15px #0008;
}

.a{
  left:85px;
}

.b{
  right:55px;
}

.tag{
  position:absolute;

  bottom:8px;

  left:0;
  right:0;

  text-align:center;

  font-size:18px;

  font-weight:800;

  text-shadow:0 3px 10px #000;
}


/* SEARCH */

.searchBox{
  width:min(760px,92%);

  margin:0 auto 28px;

  position:relative;
}

.searchBox input{
  width:100%;

  padding:17px 20px 17px 52px;

  border:1px solid #ffffff20;

  border-radius:20px;

  outline:none;

  color:#fff;

  background:#ffffff0e;

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  font-size:15px;

  box-shadow:
    0 15px 35px #00018,
    inset 0 1px #fff1;

  transition:.25s;
}

.searchBox input:focus{
  border-color:#ffffff45;

  background:#ffffff14;

  box-shadow:
    0 15px 40px #00025,
    0 0 0 4px #ffffff08;
}

.searchBox input::placeholder{
  color:#ffffff88;
}

.searchIcon{
  position:absolute;

  left:18px;
  top:50%;

  transform:translateY(-50%);

  font-size:19px;

  opacity:.8;

  pointer-events:none;
}


/* SONG SECTION */

.section{
  width:min(760px,92%);
  margin:0 auto;
}

.sectionTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin:18px 0 12px;
  padding:0 3px;
}

.sectionTitle h2{
  margin:0;
  font-size:21px;
}

.sectionTitle span{
  padding:6px 10px;

  border:1px solid #ffffff14;
  border-radius:999px;

  background:#ffffff08;

  font-size:11px;
  opacity:.7;
}


/* SONG CARD */

.song{
  position:relative;

  display:flex;
  align-items:center;

  gap:14px;

  padding:12px;

  margin:10px 0;

  border:1px solid #ffffff12;

  border-radius:20px;

  background:
    linear-gradient(135deg,#ffffff0d,#ffffff03),
    #171a1c80;

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  cursor:pointer;

  /* Performance: off-screen song cards skip rendering until needed */
  content-visibility:auto;
  contain-intrinsic-size:80px;

  transition:
    transform .2s ease,
    border-color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

.song:hover{
  transform:translateY(-3px);

  border-color:#ffffff2c;

  background:
    linear-gradient(135deg,#ffffff14,#ffffff06),
    #171a1c95;

  box-shadow:
    0 15px 35px #00035;
}

.song:active{
  transform:scale(.985);
}


/* PREMIUM CARD POLISH */
.song{
  border-color:#ffffff18;
  box-shadow:
    0 10px 28px #00020,
    inset 0 1px #ffffff12;
  transition:
    transform .2s ease,
    border-color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

@media (hover:hover){
  .song:hover{
    transform:translateY(-3px);
    border-color:#ffffff35;
    background:
      linear-gradient(135deg,#ffffff18,#ffffff07),
      #171a1caa;
    box-shadow:
      0 18px 38px #00035,
      inset 0 1px #ffffff1c;
  }

  .song:hover .cover{
    transform:scale(1.035);
  }
}

.song:active{
  transform:scale(.985);
}

.cover{
  transition:transform .2s ease, box-shadow .2s ease;
}

.song.playing .cover{
  box-shadow:
    0 9px 22px #0008,
    inset 0 1px #fff3,
    0 0 0 1px #ffffff18;
}

/* CURRENT SONG */

.song.playing{
  border-color:#ffffff38;

  background:
    linear-gradient(135deg,#ffffff18,#ffffff07),
    #171a1caa;

  box-shadow:
    0 0 0 1px #ffffff0c,
    0 12px 35px #00035,
    0 0 25px #ffffff08;
}

.song.playing .title{
  color:#fff;
}

.cover{
  width:55px;
  height:55px;

  flex:none;

  border-radius:16px;

  background:
    radial-gradient(
      circle,
      #f1c55d 0 18%,
      #3b2810 19% 40%,
      #d18c29 41% 47%,
      #17100a 48% 70%,
      #8c5c1b 71%
    );

  box-shadow:
    0 7px 17px #0007,
    inset 0 1px #fff3;
  overflow:hidden;
}

.cover img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:inherit;
}

.playing .cover{
  animation:coverPulse 1.8s ease-in-out infinite;
}

@keyframes coverPulse{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.045);
  }
}

.meta{
  flex:1;
  min-width:0;
}

.title{
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  font-size:15px;
}

.artist{
  margin-top:5px;

  font-size:12px;

  opacity:.58;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* EQUALIZER */

.equalizer{
  display:none;

  align-items:flex-end;

  gap:3px;

  width:22px;
  height:20px;

  margin-right:2px;
}

.playing .equalizer{
  display:flex;
}

.eqBar{
  width:4px;

  height:7px;

  border-radius:3px;

  background:#fff;

  animation:eq .7s ease-in-out infinite alternate;
}

.eqBar:nth-child(2){
  animation-delay:.2s;
}

.eqBar:nth-child(3){
  animation-delay:.4s;
}

@keyframes eq{
  from{
    height:5px;
    opacity:.45;
  }

  to{
    height:18px;
    opacity:1;
  }
}


/* PLAY BUTTON */

.playBtn{
  width:42px;
  height:42px;

  flex:none;

  border:0;

  border-radius:50%;

  cursor:pointer;

  background:#fff;

  color:#111;

  box-shadow:
    0 6px 18px #0005;

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.playBtn:hover{
  transform:scale(1.09);

  box-shadow:
    0 8px 22px #0007;
}

.playing .playBtn{
  background:#ffffffeb;

  transform:scale(1.04);
}


/* PLAYER */

.player{
  position:fixed;

  left:50%;
  bottom:15px;

  transform:translateX(-50%);

  z-index:20;

  width:min(720px,94%);

  display:flex;
  align-items:center;

  gap:12px;

  padding:11px 14px;

  border:1px solid #ffffff2b;

  border-radius:27px;

  background:
    linear-gradient(135deg,#ffffff12,#ffffff04),
    #17151cdd;

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  box-shadow:
    0 20px 55px #0009,
    0 0 35px #0003,
    inset 0 1px #fff3;

  transition:
    box-shadow .25s ease,
    border-color .25s ease,
    transform .25s ease;
}

.player.active{
  border-color:#ffffff35;

  box-shadow:
    0 20px 55px #0009,
    0 0 35px #ffffff0c,
    inset 0 1px #fff3;
}

.player .cover{
  width:54px;
  height:54px;

  flex:none;

  border:1px solid #ffffff25;
  box-shadow:0 7px 20px #0006;

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.player.active .cover{
  transform:scale(1.035);
  box-shadow:0 8px 24px #0007,0 0 18px #ffffff0a;
}

.playerInfo{
  flex:1;
  min-width:0;
}

.playerTitle{
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  font-size:14px;
}

.playerArtist{
  font-size:11px;

  opacity:.58;

  margin-top:3px;
}

audio{
  width:100%;
  height:31px;
  margin-top:4px;
}

.controls{
  display:flex;
  align-items:center;
  gap:5px;

  padding:4px;
  border:1px solid #ffffff12;
  border-radius:24px;
  background:#ffffff05;
}

.controls button{
  width:36px;
  height:36px;

  border:0;

  background:transparent;

  color:#fff;

  font-size:22px;

  cursor:pointer;

  border-radius:50%;

  transition:
    transform .18s ease,
    background .18s ease;
}

.controls button:hover{
  background:#ffffff12;
  transform:scale(1.06);
}

.controls button:active{
  transform:scale(.94);
}

.mainBtn{
  width:43px!important;
  height:43px!important;

  border-radius:50%!important;

  background:#fff!important;

  color:#111!important;

  font-size:17px!important;

  box-shadow:0 6px 18px #0005;

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.mainBtn:hover{
  transform:scale(1.06);
  box-shadow:0 8px 22px #0007;
}

.player.active{
  box-shadow:
    0 20px 55px #0009,
    0 0 35px #ffffff09,
    inset 0 1px #fff2;
}


/* OTHER BUTTONS */

.horn{
  position:fixed;

  left:18px;
  bottom:125px;

  z-index:15;

  padding:10px 15px;

  border:1px solid #ffffff20;

  border-radius:15px;

  color:#fff;

  background:#173d7380;

  backdrop-filter:blur(15px);

  cursor:pointer;
}

.onlineBox{
  position:fixed;

  right:18px;
  bottom:125px;

  z-index:15;

  padding:10px 14px;

  border:1px solid #ffffff20;

  border-radius:15px;

  background:#173d7380;

  backdrop-filter:blur(15px);

  font-size:12px;
}

.empty{
  text-align:center;

  padding:35px 20px;

  margin-top:10px;

  border:1px dashed #ffffff18;

  border-radius:20px;

  background:#ffffff05;

  opacity:.6;
}


/* MOBILE POLISH */

@media(max-width:600px){

  body{
    padding-bottom:145px;
    overflow-x:hidden;
  }

  header{
    height:58px;
    padding:0 12px;
  }

  .clock{

  }

  }

/* SMALL PHONES */

@media(max-width:380px){

  .heroTitle{
    margin-top:30px;
  }

  .heroTitle h1{
    font-size:49px;
    letter-spacing:-3px;
  }

  .hero{
    height:195px;
  }

  .auto{
    transform:scale(.43);
  }

  @keyframes floatAuto{
    0%,100%{
      transform:translateY(0) scale(.43);
    }

    50%{
      transform:translateY(-5px) scale(.43);
    }
  }

  .playerArtist{
    display:none;
  }

  .controls button{
    width:27px;
  }

  .mainBtn{
    width:35px!important;
    height:35px!important;
  }

  .horn,
  .onlineBox{
    bottom:98px;
  }
}



/* MOBILE PERFORMANCE */
@media (max-width:600px){
  header,
  .search,
  .player,
  .adminPanel{
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }

  .auto{
    filter:drop-shadow(0 18px 18px #0007);
  }
}


/* RIDE MODE — STEP 2 */
.rideModeBtn{
  position:relative;
  z-index:4;
  margin:18px auto 0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:12px 18px;
  border:1px solid #ffffff2b;
  border-radius:999px;
  color:#fff;
  background:linear-gradient(135deg,#ffffff18,#ffffff08);
  box-shadow:0 12px 30px #0003,inset 0 1px #fff2;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.rideModeBtn:hover{
  transform:translateY(-2px) scale(1.02);
  border-color:#ffffff55;
  box-shadow:0 16px 38px #0005,0 0 24px #ffffff0b,inset 0 1px #fff3;
}
.rideModeBtn:active{transform:scale(.97);}

.rideOverlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:linear-gradient(180deg,#071526 0%,#102c45 48%,#11151a 100%);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .35s ease,visibility .35s ease;
}
.rideOverlay.open{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
.rideSky{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 18% 22%,#ffffff 0 1px,transparent 2px),
    radial-gradient(circle at 74% 18%,#ffffffb5 0 1px,transparent 2px),
    radial-gradient(circle at 48% 34%,#ffffff8c 0 1px,transparent 2px);
  background-size:150px 150px,190px 190px,230px 230px;
  opacity:.45;
}
.rideGlow{
  position:absolute;
  width:70vw;
  height:35vw;
  max-width:900px;
  max-height:420px;
  border-radius:50%;
  background:radial-gradient(ellipse,#4e93c51c,transparent 68%);
  filter:blur(10px);
}

.rideCity{
  position:absolute;
  left:0;
  right:0;
  bottom:31%;
  height:30%;
  z-index:1;
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:0 2vw;
  overflow:hidden;
  opacity:.82;
}
.rideCity span{
  position:relative;
  flex:0 0 clamp(44px,6vw,92px);
  height:var(--h);
  border:1px solid #ffffff08;
  border-bottom:0;
  background:
    repeating-linear-gradient(90deg,transparent 0 12px,#f6d86a18 12px 16px,transparent 16px 25px),
    repeating-linear-gradient(180deg,#ffffff0d 0 10px,transparent 10px 19px),
    linear-gradient(180deg,#182735,#0b1118);
  box-shadow:0 -12px 35px #0005;
}
.rideCity span:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:5px;
  background:#7fb7d61a;
}
.rideCity span:nth-child(2n){flex-basis:clamp(55px,8vw,115px)}
.rideCity span:nth-child(3n){flex-basis:clamp(38px,5vw,76px)}
.rideTraffic{
  position:absolute;
  z-index:2;
  left:0;
  right:0;
  bottom:19%;
  height:26px;
  overflow:hidden;
  opacity:.65;
}
.rideTraffic:before,.rideTraffic:after{
  content:"";
  position:absolute;
  top:10px;
  width:14px;
  height:5px;
  border-radius:50%;
  background:#ffd85c;
  box-shadow:0 0 12px #ffd85c99;
  animation:rideTrafficMove 5s linear infinite;
}
.rideTraffic:after{
  top:17px;
  width:11px;
  height:4px;
  background:#ff5d5d;
  box-shadow:0 0 12px #ff5d5d88;
  animation-duration:7s;
  animation-delay:-2.5s;
}
@keyframes rideTrafficMove{
  from{transform:translateX(-80px)}
  to{transform:translateX(calc(100vw + 80px))}
}
.rideRoad:before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(180deg,transparent 0 28px,#ffffff18 28px 32px,transparent 32px 76px);
  transform:translateY(-20%);
  animation:rideRoadFlow 1.4s linear infinite;
}
@keyframes rideRoadFlow{
  from{transform:translateY(-80px)}
  to{transform:translateY(80px)}
}
@media(prefers-reduced-motion:reduce){
  .rideTraffic:before,.rideTraffic:after,.rideRoad:before{animation:none}
}

.rideRoad{
  position:absolute;
  left:-10%;
  right:-10%;
  bottom:-10%;
  height:46%;
  transform:perspective(420px) rotateX(58deg);
  transform-origin:bottom;
  background:
    repeating-linear-gradient(90deg,transparent 0 13%,#ffffff12 13.2% 13.8%,transparent 14% 26%),
    linear-gradient(180deg,#222831,#0c0e11);
  border-top:2px solid #ffffff0c;
}
.rideRoad:after{
  content:"";
  position:absolute;
  left:50%;
  top:-5%;
  width:8px;
  height:120%;
  transform:translateX(-50%);
  background:repeating-linear-gradient(180deg,#f6d86a 0 35px,transparent 35px 70px);
  opacity:.75;
  filter:drop-shadow(0 0 8px #f6d86a55);
}
.rideAuto{
  position:relative;
  z-index:3;
  font-size:92px;
  transform:translateY(18px);
  filter:drop-shadow(0 24px 25px #0009);
  animation:rideAutoFloat 1.8s ease-in-out infinite;
}
@keyframes rideAutoFloat{
  0%,100%{transform:translateY(18px) rotate(-.7deg)}
  50%{transform:translateY(8px) rotate(.7deg)}
}
.ridePanel{
  position:absolute;
  z-index:5;
  top:28px;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,calc(100% - 28px));
  text-align:center;
}
.rideEyebrow{
  font-size:11px;
  letter-spacing:3px;
  opacity:.55;
  font-weight:800;
}
.ridePanel h2{
  margin:7px 0 4px;
  font-size:clamp(28px,6vw,48px);
  letter-spacing:-1px;
}
.ridePanel p{
  margin:0;
  opacity:.65;
  font-size:13px;
}
.rideClose{
  position:absolute;
  top:18px;
  right:18px;
  z-index:6;
  width:42px;
  height:42px;
  border:1px solid #ffffff25;
  border-radius:50%;
  color:#fff;
  background:#ffffff0d;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  font-size:22px;
  cursor:pointer;
}
.rideStatus{
  position:absolute;
  z-index:5;
  left:50%;
  bottom:32px;
  transform:translateX(-50%);
  padding:9px 14px;
  border:1px solid #ffffff18;
  border-radius:999px;
  background:#0004;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  font-size:12px;
  white-space:nowrap;
  opacity:.8;
}
@media(max-width:600px){
  .rideModeBtn{margin-top:14px;padding:11px 16px;font-size:13px;}
  .ridePanel{top:22px;}
  .rideAuto{font-size:70px;}
  .rideRoad{height:40%;}
  .rideStatus{bottom:22px;font-size:11px;}
}

</style>
</head>


<body>


<header>

  <span
    class="clock"
    id="clock"
  >
    --:--:--
  </span>

  <span class="live">
    <i class="dot"></i>
    <b id="count">1</b>
    on the highway
  </span>

  <span>•••</span>

</header>


<section class="heroTitle">

  <h1>ऑटो वाला</h1>

  <p>
    🎵 सफर अपना, गाना अपना
  </p>

</section>


<section class="hero">

  <div class="auto">

    <div class="roof"></div>

    <div class="cab"></div>

    <div class="win w1"></div>

    <div class="win w2"></div>

    <div class="front"></div>

    <div class="base"></div>

    <div class="wheel a"></div>

    <div class="wheel b"></div>

  </div>

  <div class="tag">
    जो डर गया, समझो मर गया 😎
  </div>

</section>

<button class="rideModeBtn" id="rideModeBtn" type="button">🚕 RIDE MODE</button>


<div class="searchBox">

  <span class="searchIcon">
    🔍
  </span>

  <input
    id="search"
    placeholder="गाना या कलाकार खोजें..."
    autocomplete="off"
  >

</div>


<section class="section">

  <div class="sectionTitle">

    <h2>🎵 गाने</h2>

    <span id="songCount">
      0 songs
    </span>

  </div>

  <div id="list"></div>

</section>


<div class="rideOverlay" id="rideOverlay" aria-hidden="true">
  <div class="rideSky"></div>
  <div class="rideGlow"></div>
  <div class="rideRoad"></div>
  <div class="rideCity" aria-hidden="true">
    <span style="--h:62%"></span>
    <span style="--h:84%"></span>
    <span style="--h:52%"></span>
    <span style="--h:72%"></span>
    <span style="--h:94%"></span>
    <span style="--h:58%"></span>
    <span style="--h:78%"></span>
    <span style="--h:48%"></span>
    <span style="--h:68%"></span>
  </div>
  <div class="rideTraffic" aria-hidden="true"></div>

  <div class="ridePanel">
    <div class="rideEyebrow">AUTO WALA • RIDE MODE</div>
    <h2>🚕 Safar Shuru</h2>
    <p>Music on karo aur ride enjoy karo 🎵</p>
  </div>

  <button class="rideClose" id="rideClose" type="button" aria-label="Close Ride Mode">×</button>

  <div class="rideAuto" aria-hidden="true">🚕</div>

  <div class="rideStatus">🎵 Ride Mode Active • Enjoy the music</div>
</div>


<button
  class="horn"
  id="horn"
>
  🔊 हॉर्न ओके प्लीज
</button>


<div class="onlineBox">
  🟢 <span id="onlineText">Live</span>
</div>


<div
  class="player"
  id="player"
>

  <div
    class="cover"
    id="pcover"
  ></div>

  <div class="playerInfo">

    <div
      class="playerTitle"
      id="ptitle"
    >
      अपना गाना चुनें
    </div>

    <div
      class="playerArtist"
      id="partist"
    >
      Auto Wala
    </div>

    <audio
      id="audio"
      controls
    ></audio>

  </div>

  <div class="controls">

    <button onclick="prev()">
      ‹
    </button>

    <button
      class="mainBtn"
      id="mainBtn"
      onclick="toggle()"
    >
      ▶
    </button>

    <button onclick="next()">
      ›
    </button>

  </div>

</div>


<script>

let songs=[];
let filteredSongs=[];
let idx=-1;

const audio=
document.getElementById("audio");


/* VISITOR */

const visitorId=
localStorage.getItem(
  "autoWalaVisitor"
) ||
(
  "visitor-" +
  Date.now() +
  "-" +
  Math.random()
    .toString(36)
    .slice(2)
);

localStorage.setItem(
  "autoWalaVisitor",
  visitorId
);


/* CLOCK */

const indiaClockFormatter=
new Intl.DateTimeFormat(
  "en-IN",
  {
    timeZone:"Asia/Kolkata",
    hour:"numeric",
    minute:"2-digit",
    second:"2-digit",
    hour12:true
  }
);

function updateClock(){

  const now=
  new Date();

  const time=
  indiaClockFormatter.format(now);

  document.getElementById(
    "clock"
  ).textContent=time;

}

updateClock();

setInterval(
  updateClock,
  1000
);


/* ONLINE */

async function heartbeat(){

  try{

    const response=
    await fetch(
      "/api/heartbeat",
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({
          visitorId
        })
      }
    );

    if(!response.ok)
      return;

    const data=
    await response.json();

    document.getElementById(
      "count"
    ).textContent=data.online;

    document.getElementById(
      "onlineText"
    ).textContent=
      data.online+
      " online";

  }catch(error){

    document.getElementById(
      "onlineText"
    ).textContent="Live";

  }

}

heartbeat();

setInterval(
  heartbeat,
  30000
);


/* VISIT */

fetch(
  "/api/visit",
  {
    method:"POST",

    headers:{
      "Content-Type":
      "application/json"
    },

    body:JSON.stringify({
      visitorId
    })
  }
).catch(()=>{});


/* CLEAN TITLE */

function cleanSongTitle(title){

  return String(title || "")
    .replace(/\.[^/.]+$/, "")
    .replace(/[_-]+/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* ESCAPE */

function esc(text){

  return String(
    text || ""
  ).replace(
    /[&<>"']/g,

    m =>
      ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m])
  );

}


/* LOAD */

async function load(){

  try{

    const response=
    await fetch(
      "/api/songs"
    );

    songs=
    await response.json();

    filteredSongs=
    [...songs];

    render();

  }catch(error){

    document.getElementById(
      "list"
    ).innerHTML=
      `
      <div class="empty">
        Songs load नहीं हो पाए 😕
      </div>
      `;

  }

}


/* RENDER */

function render(){

  const box=
  document.getElementById(
    "list"
  );

  document.getElementById(
    "songCount"
  ).textContent=
    filteredSongs.length+
    " songs";


  if(!filteredSongs.length){

    box.innerHTML=
      `
      <div class="empty">
        कोई गाना नहीं मिला 😕
      </div>
      `;

    return;

  }


  box.innerHTML=
  filteredSongs
  .map(
    (song,i)=>`

      <div
        class="song ${
          idx===i &&
          audio.src
          ? "playing"
          : ""
        }"
        onclick="play(${i})"
      >

        <div class="cover">
          ${
            song.cover
            ?
            `<img src="${esc(song.cover)}" alt="" loading="lazy" decoding="async">`
            :
            ""
          }
        </div>

        <div class="meta">

          <div class="title">
            ${esc(
              cleanSongTitle(
                song.title
              )
            )}
          </div>

          <div class="artist">
            ${esc(
              song.artist
            )}
          </div>

        </div>


        <div class="equalizer">

          <span class="eqBar"></span>
          <span class="eqBar"></span>
          <span class="eqBar"></span>

        </div>


        <button
          class="playBtn"
          onclick="event.stopPropagation();play(${i})"
        >
          ${
            idx===i &&
            !audio.paused
            ? "❚❚"
            : "▶"
          }
        </button>

      </div>

    `
  )
  .join("");

}


/* SEARCH */

document
.getElementById("search")
.addEventListener(
  "input",
  function(){

    const query=
    this.value
      .trim()
      .toLowerCase();

    filteredSongs=
    songs.filter(
      song=>
        String(song.title)
          .toLowerCase()
          .includes(query)
        ||
        String(song.artist)
          .toLowerCase()
          .includes(query)
    );

    idx=-1;

    render();

  }
);


/* PLAY */

async function play(i){

  if(!filteredSongs[i])
    return;

  const song=
  filteredSongs[i];

  idx=i;

  audio.src=
    song.audio;

  document.getElementById(
    "ptitle"
  ).textContent=
    cleanSongTitle(
      song.title
    );

  document.getElementById(
    "partist"
  ).textContent=
    song.artist ||
    "Various Artists";


  document.getElementById(
    "pcover"
  ).style.background=
    song.cover
    ?
    `url('${song.cover}') center/cover`
    :
    "";


  document.getElementById(
    "player"
  ).classList.add(
    "active"
  );


  try{

    await audio.play();

  }catch(error){}


  fetch(
    "/api/play",
    {
      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({
        songId:song.id
      })
    }
  ).catch(()=>{});


  render();

}


/* TOGGLE */

function toggle(){

  if(
    !audio.src &&
    filteredSongs.length
  ){

    play(0);

    return;

  }


  if(audio.paused){

    audio.play();

  }else{

    audio.pause();

  }

}


/* NEXT */

function next(){

  if(!filteredSongs.length)
    return;

  idx=
    (idx+1)
    %
    filteredSongs.length;

  play(idx);

}


/* PREVIOUS */

function prev(){

  if(!filteredSongs.length)
    return;

  idx=
    (idx-1+
      filteredSongs.length)
    %
    filteredSongs.length;

  play(idx);

}


/* AUDIO */

audio.onended=
  next;


audio.onplay=
  ()=>{

    document.getElementById(
      "mainBtn"
    ).textContent="❚❚";

    render();

  };


audio.onpause=
  ()=>{

    document.getElementById(
      "mainBtn"
    ).textContent="▶";

    render();

  };


/* HORN */

document
.getElementById("horn")
.addEventListener(
  "click",
  ()=>{
    alert(
      "📢 हॉर्न ओके प्लीज 😎"
    );
  }
);


/* START */

load();



/* RIDE MODE — STEP 2 */
const rideModeBtn=document.getElementById("rideModeBtn");
const rideOverlay=document.getElementById("rideOverlay");
const rideClose=document.getElementById("rideClose");

function openRideMode(){
  rideOverlay.classList.add("open");
  rideOverlay.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
}

function closeRideMode(){
  rideOverlay.classList.remove("open");
  rideOverlay.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
}

rideModeBtn.addEventListener("click",openRideMode);
rideClose.addEventListener("click",closeRideMode);
rideOverlay.addEventListener("click",e=>{
  if(e.target===rideOverlay) closeRideMode();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && rideOverlay.classList.contains("open")) closeRideMode();
});

</script>

</body>
</html>
