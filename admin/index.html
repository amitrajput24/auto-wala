<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Wala Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
      background: #111;
      color: white;
    }

    h1 {
      text-align: center;
    }

    form, .song {
      background: #222;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
    }

    button {
      background: white;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    .delete {
      background: #d33;
      color: white;
    }

    #message {
      text-align: center;
      margin: 15px;
    }
  </style>
</head>

<body>

<h1>🎵 Auto Wala Admin</h1>

<form id="uploadForm">

  <input
    type="text"
    id="title"
    placeholder="Song title"
    required
  >

  <input
    type="text"
    id="artist"
    placeholder="Artist name"
  >

  <label>Song file:</label>
  <input
    type="file"
    id="audio"
    accept="audio/*"
    required
  >

  <label>Cover image (optional):</label>
  <input
    type="file"
    id="cover"
    accept="image/*"
  >

  <button type="submit">⬆️ Upload Song</button>

</form>

<div id="message"></div>

<h2>Uploaded Songs</h2>

<div id="songs"></
