<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Wala Admin</title>
<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:20px;background:#111;color:#fff}
h1{text-align:center}
form,.song{background:#222;padding:20px;margin-top:20px;border-radius:12px}
input,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:8px;border:0}
button{background:#fff;color:#111;font-weight:bold;cursor:pointer}
audio{width:100%;margin-top:10px}
.delete{background:#d33;color:#fff}
#message{text-align:center;margin:15px}
</style>
</head>
<body>

<h1>🎵 Auto Wala Admin</h1>

<form id="uploadForm">
<input id="title" type="text" placeholder="Song title" required>
<input id="artist" type="text" placeholder="Artist name">

<label>Song file:</label>
<input id="audio" type="file" accept=".p3,audio/mpeg" multiple required>

<label>Cover image (optional):</label>
<input id="cover" type="file" accept="image/*">

<button type="submit">⬆️ Upload All Song</button>
</form>

<div id="message"></div>

<h2>Uploaded Songs</h2>
<div id="songs"></div>

<script>
const token=localStorage.getItem("adminToken");

if(!token){
  alert("Please login first");
  location.href="/admin/";
}

async function loadSongs(){
  const response=await fetch("/api/songs");
  const songs=await response.json();
  const box=document.getElementById("songs");
  box.innerHTML="";

  if(!songs.length){
    box.innerHTML="<p>No songs uploaded yet.</p>";
    return;
  }

  songs.forEach(song=>{
    const div=document.createElement("div");
    div.className="song";

    div.innerHTML=
      "<h3>"+escapeHtml(song.title)+"</h3>"+
      "<p>"+escapeHtml(song.artist)+"</p>"+
      (song.cover
        ? '<img src="'+song.cover+'" style="width:100%;max-height:250px;object-fit:cover;border-radius:8px;">'
        : "")+
      '<audio controls src="'+song.audio+'"></audio>'+
      '<button class="delete" onclick="deleteSong(\''+song.id+'\')">🗑️ Delete</button>';

    box.appendChild(div);
  });
}

document.getElementById("uploadForm").addEventListener("submit",async function(e){
  e.preventDefault();

  const message=document.getElementById("message");
  message.innerText="Uploading...";

  const fd=new FormData();

  fd.append("title",document.getElementById("title").value);
  fd.append("artist",document.getElementById("artist").value);
  fd.append("audio",document.getElementById("audio").files[0]);

  const cover=document.getElementById("cover").files[0];
  if(cover) fd.append("cover",cover);

  try{
    const response=await fetch("/api/songs",{
      method:"POST",
      headers:{
        "Authorization":"Bearer "+token
      },
      body:fd
    });

    const data=await response.json();

    if(!response.ok) throw new Error(data.error||"Upload failed");

    message.innerText="✅ Song uploaded successfully!";
    document.getElementById("uploadForm").reset();
    loadSongs();

  }catch(error){
    message.innerText="❌ "+error.message;
  }
});

async function deleteSong(id){
  if(!confirm("Delete this song?")) return;

  const response=await fetch("/api/songs/"+id,{
    method:"DELETE",
    headers:{
      "Authorization":"Bearer "+token
    }
  });

  const data=await response.json();

  if(data.ok) loadSongs();
  else alert(data.error||"Delete failed");
}

function escapeHtml(text){
  const div=document.createElement("div");
  div.textContent=text||"";
  return div.innerHTML;
}

loadSongs();
</script>

</body>
</html>
